<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>物販計算</title>

<style>

body{
    font-family:sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.item{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:10px;
}

.controls{
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:10px;
}

button{
    width:40px;
    height:40px;
    font-size:20px;
}

.total{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-top:20px;
    font-size:20px;
}

</style>
</head>

<body>

<h1>物販計算</h1>

<div id="items"></div>

<div class="total">
    <p>合計：<span id="total">0</span> 円</p>

    <p>
        特典：<span id="bonus">0</span> 枚
        （全6種ランダム・最大20枚）
    </p>

    <p id="nextBonus"></p>
    <button onclick="resetCart()">
全クリア
</button>
</div>

<script>

let goods = [];

async function loadGoods(){

    const response = await fetch("goods.json");

    goods = await response.json();

const saved = localStorage.getItem("goodsData");

if(saved){

    const savedGoods = JSON.parse(saved);

    goods.forEach((item,index)=>{

        item.qty = savedGoods[index]?.qty || 0;
    });

}else{

    goods.forEach(item=>{
        item.qty = 0;
    });
}

    render();
}
    
function resetCart(){

    goods.forEach(item=>{
        item.qty = 0;
    });

    saveData();

    render();
}
    
function render(){

    const itemsDiv = document.getElementById("items");

    itemsDiv.innerHTML = "";

    let currentCategory = "";

    goods.forEach((item,index)=>{

        // カテゴリ見出し
        if(item.category && item.category !== currentCategory){

            currentCategory = item.category;

            const categoryDiv = document.createElement("h2");

            categoryDiv.textContent = currentCategory;

            categoryDiv.style.marginTop = "30px";

            itemsDiv.appendChild(categoryDiv);
        }

        const div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `
            <h3>${item.name}</h3>

            <p>${item.price}円</p>

            ${item.limit ? `<p>制限 ${item.limit}個</p>` : ""}

            <div class="controls">
                <button onclick="changeQty(${index},-1)">-</button>

                <span>${item.qty}</span>

                <button onclick="changeQty(${index},1)">+</button>
            </div>
        `;

        itemsDiv.appendChild(div);
    });

    calculate();
}

function changeQty(index,amount){

    const item = goods[index];

    item.qty += amount;

    if(item.qty < 0){
        item.qty = 0;
    }

    if(item.limit && item.qty > item.limit){

        item.qty = item.limit;

        alert(`${item.name} は ${item.limit} 個までです`);
    }
 saveData();
    render();
}

function calculate(){

    let total = 0;

    goods.forEach(item=>{
        total += item.price * item.qty;
    });

    let bonus = Math.floor(total / 3000);

    // 特典上限20
    if(bonus > 20){
        bonus = 20;
    }

    document.getElementById("total").textContent = total;

    document.getElementById("bonus").textContent = bonus;

    // 次の特典まで
    if(bonus >= 20){

        document.getElementById("nextBonus").textContent =
            "特典上限に達しています";

    }else{

        const remain = 3000 - (total % 3000);

        // ちょうど3000円の場合
        const next = remain === 3000 ? 0 : remain;

        if(next === 0){

            document.getElementById("nextBonus").textContent =
                "特典獲得ラインです";

        }else{

            document.getElementById("nextBonus").textContent =
                `あと ${next} 円で特典1枚追加`;
        }
    }
}
loadGoods();

</script>

</body>
</html>
